<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Carpark Lot Check — Singapore HDB</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Archivo:wght@500;700;900&display=swap');

  :root{
    /* page — light painted concrete */
    --page: #eef0ea;
    --page-dot: rgba(30,32,28,0.05);
    --card: #ffffff;
    --card-border: #d8dbd0;
    --ink: #23261f;
    --ink-dim: #767b6e;
    --hazard: #e8ac00;
    --hazard-dark: #23261f;

    /* LED board — stays dark for signage contrast */
    --board-bg1: #23262a;
    --board-bg2: #1a1c1f;
    --board-border: #34373d;
    --board-ink: #e8e6df;
    --board-ink-dim: #91959c;
    --led-amber: #ffb703;
    --led-green: #5fe37b;
    --led-red: #ff5a5a;
    --led-off: #33363b;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html{ -webkit-text-size-adjust:100%; }

  body{
    margin:0;
    background: var(--page);
    background-image: radial-gradient(circle at 1px 1px, var(--page-dot) 1px, transparent 0);
    background-size: 18px 18px;
    color: var(--ink);
    font-family: 'Archivo', system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding-bottom: 48px;
  }

  .app{ width:100%; max-width: 480px; }

  .hazard-bar{
    height:8px;
    background: repeating-linear-gradient(135deg, var(--hazard) 0 12px, var(--hazard-dark) 12px 24px);
  }

  header{
    padding: 22px 18px 18px;
    border-bottom: 1px solid var(--card-border);
  }
  .eyebrow{
    font-family:'Share Tech Mono', monospace;
    font-size:11px;
    letter-spacing:.16em;
    color: #a3790b;
    text-transform:uppercase;
  }
  h1{
    margin:6px 0 6px;
    font-size: clamp(24px,7vw,30px);
    font-weight:900;
    letter-spacing:-0.01em;
    line-height:1.1;
  }
  .sub{
    color:var(--ink-dim);
    font-size:14px;
    line-height:1.5;
  }

  main{ padding: 18px 18px 0; }

  /* ---- search ---- */
  .search-wrap{ position:relative; }
  input#carparkInput{
    width:100%;
    background: var(--card);
    border: 2px solid var(--card-border);
    color: var(--ink);
    font-family:'Share Tech Mono', monospace;
    font-size: 18px; /* >=16px avoids iOS zoom */
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 14px 16px;
    border-radius: 10px;
    outline:none;
    transition: border-color .15s ease;
  }
  input#carparkInput::placeholder{
    color: #a4a89c;
    text-transform:none;
    letter-spacing:normal;
    font-family:'Archivo',sans-serif;
    font-size:14px;
  }
  input#carparkInput:focus{ border-color: var(--hazard); }

  .suggestions{
    margin-top:8px;
    background: var(--card);
    border:1px solid var(--card-border);
    border-radius:10px;
    max-height: 240px;
    overflow-y:auto;
    display:none;
  }
  .suggestions.open{ display:block; }
  .suggestions button{
    display:block; width:100%;
    text-align:left;
    background:none; border:none;
    color: var(--ink);
    font-family:'Share Tech Mono', monospace;
    font-size:15px;
    padding: 12px 16px;
    cursor:pointer;
    border-bottom:1px solid var(--card-border);
  }
  .suggestions button:last-child{ border-bottom:none; }
  .suggestions button:active,
  .suggestions button:hover{ background: var(--page); color: #a3790b; }

  .hint{
    margin-top:10px;
    font-size:12px;
    color: var(--ink-dim);
    font-family:'Share Tech Mono', monospace;
  }
  .hint b{ color:var(--ink); font-weight:400; }

  .name-preview{
    margin-top:8px;
    font-size:14px;
    font-weight:700;
    color: var(--ink);
    display:none;
    align-items:center;
    gap:8px;
  }
  .name-preview.show{ display:flex; }
  .name-preview .pin{
    color: #a3790b;
    font-size:12px;
  }

  /* ---- status states ---- */
  #status{ margin-top: 18px; }
  .msg{
    font-family:'Share Tech Mono', monospace;
    font-size:13px;
    color: var(--ink-dim);
    padding: 10px 0;
  }
  .msg.error{ color: #c23b3b; }

  .match-chips{ margin-top:8px; display:flex; flex-wrap:wrap; gap:8px; }
  .match-chips button{
    font-family:'Share Tech Mono',monospace;
    background: var(--card);
    color: var(--ink);
    border:1px solid var(--card-border);
    border-radius:8px;
    padding:9px 13px;
    font-size:14px;
    cursor:pointer;
  }
  .match-chips button:active{ background: var(--page); }

  /* ---- LED result board ---- */
  .board{
    display:none;
    margin-top: 18px;
    background: linear-gradient(180deg,var(--board-bg1),var(--board-bg2));
    border: 1px solid var(--board-border);
    border-radius: 14px;
    padding: 18px 16px 16px;
    box-shadow: 0 16px 32px -18px rgba(20,20,15,0.35);
  }
  .board.open{ display:block; }

  .board-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    border-bottom: 1px dashed var(--board-border);
    padding-bottom:12px;
    margin-bottom:14px;
    gap:10px;
  }
  .cp-number{
    font-family:'Share Tech Mono', monospace;
    color: var(--board-ink);
    font-size: 26px;
    letter-spacing:.03em;
    word-break: break-all;
  }
  .cp-label{
    font-size:10px;
    color: var(--board-ink-dim);
    text-transform:uppercase;
    letter-spacing:.12em;
    margin-bottom:4px;
  }
  .cp-name{
    font-family:'Archivo', sans-serif;
    font-size:12px;
    font-weight:700;
    color: var(--board-ink-dim);
    margin-top:4px;
    line-height:1.3;
  }
  .updated{
    text-align:right;
    font-family:'Share Tech Mono', monospace;
    font-size:11px;
    color: var(--board-ink-dim);
    white-space:nowrap;
    padding-top:2px;
  }
  .updated .dot{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background: var(--led-green);
    margin-right:6px;
    box-shadow: 0 0 6px var(--led-green);
  }

  .lot-grid{ display:flex; flex-direction:column; gap:10px; }
  .lot-row{
    background: rgba(0,0,0,0.22);
    border:1px solid var(--board-border);
    border-radius:10px;
    padding: 12px 14px;
  }
  .lot-row-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .lot-type{
    color: var(--board-ink);
    font-size:13px;
    font-weight:700;
    letter-spacing:.02em;
  }
  .lot-type-sub{
    font-size:11px;
    color: var(--board-ink-dim);
    font-family:'Share Tech Mono', monospace;
    margin-top:2px;
  }
  .lot-count{
    font-family:'Share Tech Mono', monospace;
    font-size: 26px;
    line-height:1;
    text-align:right;
    text-shadow: 0 0 12px currentColor;
    white-space:nowrap;
  }
  .lot-count small{
    font-size:12px;
    color: var(--board-ink-dim);
    text-shadow:none;
    font-weight:400;
  }
  .lot-count.ok{ color: var(--led-green); }
  .lot-count.low{ color: var(--led-amber); }
  .lot-count.full{ color: var(--led-red); }

  .bar-track{
    margin-top:8px;
    height:6px; border-radius:3px;
    background: var(--led-off);
    overflow:hidden;
  }
  .bar-fill{ height:100%; border-radius:3px; }

  footer{
    margin-top: 34px;
    padding: 16px 18px 0;
    font-size:11px;
    color: var(--ink-dim);
    font-family:'Share Tech Mono', monospace;
    text-align:center;
    line-height:1.6;
  }

  @media (max-width: 380px){
    header{ padding:18px 14px 16px; }
    main{ padding:16px 14px 0; }
  }

  @media (prefers-reduced-motion: reduce){ * { transition:none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="hazard-bar"></div>
  <header>
    <div class="eyebrow">Live · data.gov.sg</div>
    <h1>Carpark Lot Check</h1>
    <p class="sub">Real-time parking lot availability at any HDB carpark in Singapore.</p>
  </header>

  <main>
    <div class="search-wrap">
      <input id="carparkInput" type="text" placeholder="Enter carpark number, e.g. ACB, HE12" autocomplete="off" inputmode="text" />
      <div class="suggestions" id="suggestions"></div>
    </div>
    <div class="name-preview" id="namePreview"><span class="pin">📍</span><span id="namePreviewText"></span></div>
    <div class="hint" id="hint">Loading carpark list&hellip;</div>

    <div id="status"></div>
    <div class="board" id="board">
      <div class="board-top">
        <div>
          <div class="cp-label">Carpark No.</div>
          <div class="cp-number" id="cpNumber">—</div>
          <div class="cp-name" id="cpName"></div>
        </div>
        <div class="updated" id="updated"><span class="dot"></span>—</div>
      </div>
      <div class="lot-grid" id="lotGrid"></div>
    </div>
  </main>

  <footer>
    Data refreshed every minute by HDB via data.gov.sg (Carpark Availability API).<br>
    Independent tool — not affiliated with HDB or the Singapore Government.
  </footer>
</div>

<script>
const API_URL = 'https://api.data.gov.sg/v1/transport/carpark-availability';
const INFO_DATASET_ID = 'd_23f946fa557947f93a8043bbef41dd09'; // HDB Carpark Information
const LOT_TYPE_LABEL = { C: 'Cars', M: 'Motorcycles', H: 'Heavy Vehicles', Y: 'Heavy Vehicles' };

const input = document.getElementById('carparkInput');
const suggestionsEl = document.getElementById('suggestions');
const hintEl = document.getElementById('hint');
const statusEl = document.getElementById('status');
const boardEl = document.getElementById('board');
const cpNumberEl = document.getElementById('cpNumber');
const cpNameEl = document.getElementById('cpName');
const updatedEl = document.getElementById('updated');
const lotGridEl = document.getElementById('lotGrid');
const namePreviewEl = document.getElementById('namePreview');
const namePreviewTextEl = document.getElementById('namePreviewText');

let allCarparkNumbers = [];
let carparkNames = {}; // carpark_number -> friendly address/name
let debounceTimer = null;
let lastLookedUp = '';

function titleCase(str){
  return str.toLowerCase().replace(/(^|[\s/(])([a-z])/g, (m, sep, ch) => sep + ch.toUpperCase());
}

// Minimal CSV parser that respects quoted fields.
function parseCSV(text){
  const rows = [];
  let cur = '', row = [], inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(inQuotes){
      if(ch === '"'){
        if(text[i+1] === '"'){ cur += '"'; i++; } else { inQuotes = false; }
      } else { cur += ch; }
    } else if(ch === '"'){
      inQuotes = true;
    } else if(ch === ','){
      row.push(cur); cur = '';
    } else if(ch === '\n' || ch === '\r'){
      if(ch === '\r' && text[i+1] === '\n') i++;
      row.push(cur); cur = '';
      if(row.length > 1 || row[0] !== ''){ rows.push(row); }
      row = [];
    } else {
      cur += ch;
    }
  }
  if(cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

function updateNamePreview(query){
  const name = carparkNames[query];
  if(query && name){
    namePreviewTextEl.textContent = name;
    namePreviewEl.classList.add('show');
  } else {
    namePreviewEl.classList.remove('show');
  }
}

function setStatus(text, isError){
  statusEl.innerHTML = text ? `<div class="msg${isError ? ' error' : ''}">${text}</div>` : '';
}

function pct(available, total){
  if(!total) return 0;
  return Math.max(0, Math.min(100, (available/total)*100));
}

function statusClass(available, total){
  const p = pct(available, total);
  if(available <= 0) return 'full';
  if(p <= 15) return 'low';
  return 'ok';
}

function renderResult(entry){
  cpNumberEl.textContent = entry.carpark_number;
  cpNameEl.textContent = carparkNames[entry.carpark_number] || '';

  const updatedDate = new Date(entry.update_datetime);
  const timeStr = isNaN(updatedDate) ? entry.update_datetime : updatedDate.toLocaleTimeString('en-SG', { hour:'2-digit', minute:'2-digit' });
  updatedEl.innerHTML = `<span class="dot"></span>Updated ${timeStr}`;

  lotGridEl.innerHTML = '';
  entry.carpark_info.forEach(info => {
    const total = parseInt(info.total_lots, 10) || 0;
    const available = parseInt(info.lots_available, 10) || 0;
    const cls = statusClass(available, total);
    const label = LOT_TYPE_LABEL[info.lot_type] || `Lot type ${info.lot_type}`;
    const barColor = cls === 'ok' ? 'var(--led-green)' : cls === 'low' ? 'var(--led-amber)' : 'var(--led-red)';

    const row = document.createElement('div');
    row.className = 'lot-row';
    row.innerHTML = `
      <div class="lot-row-top">
        <div>
          <div class="lot-type">${label}</div>
          <div class="lot-type-sub">${total} total lots</div>
        </div>
        <div class="lot-count ${cls}">${available}<small> / ${total}</small></div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct(available,total)}%; background:${barColor};"></div></div>
    `;
    lotGridEl.appendChild(row);
  });

  boardEl.classList.add('open');
}

async function lookup(rawQuery){
  const query = rawQuery.trim().toUpperCase();
  if(!query){
    setStatus('Select or enter a carpark number to see its availability.');
    boardEl.classList.remove('open');
    lastLookedUp = '';
    return;
  }
  if(query === lastLookedUp) return;

  setStatus('Checking live availability&hellip;');
  boardEl.classList.remove('open');

  try{
    const res = await fetch(API_URL);
    if(!res.ok) throw new Error('API request failed (' + res.status + ')');
    const data = await res.json();
    const carparkData = (data.items && data.items[0] && data.items[0].carpark_data) || [];

    const exact = carparkData.find(c => c.carpark_number === query);
    if(exact){
      lastLookedUp = query;
      setStatus('');
      renderResult(exact);
    } else {
      lastLookedUp = '';
      const partial = carparkData.filter(c => c.carpark_number.includes(query)).slice(0, 8);
      if(partial.length){
        setStatus(`No exact match for "${query}". Did you mean:`);
        const list = document.createElement('div');
        list.className = 'match-chips';
        partial.forEach(c => {
          const b = document.createElement('button');
          b.textContent = c.carpark_number;
          b.onclick = () => { input.value = c.carpark_number; suggestionsEl.classList.remove('open'); lookup(c.carpark_number); };
          list.appendChild(b);
        });
        statusEl.appendChild(list);
      } else {
        setStatus(`Carpark "${query}" was not found. Try a different carpark number.`, true);
      }
    }
  } catch(err){
    lastLookedUp = '';
    setStatus('Could not reach the live carpark feed. Please try again in a moment.', true);
    console.error(err);
  }
}

function updateSuggestions(query){
  if(!query || !allCarparkNumbers.length){
    suggestionsEl.classList.remove('open');
    suggestionsEl.innerHTML = '';
    return;
  }
  const matches = allCarparkNumbers.filter(n => n.startsWith(query)).slice(0, 8);
  if(!matches.length || (matches.length === 1 && matches[0] === query)){
    suggestionsEl.classList.remove('open');
    suggestionsEl.innerHTML = '';
    return;
  }
  suggestionsEl.innerHTML = '';
  matches.forEach(n => {
    const b = document.createElement('button');
    b.textContent = n;
    b.onclick = () => {
      input.value = n;
      suggestionsEl.classList.remove('open');
      suggestionsEl.innerHTML = '';
      lookup(n);
    };
    suggestionsEl.appendChild(b);
  });
  suggestionsEl.classList.add('open');
}

function handleInput(){
  const query = input.value.trim().toUpperCase();
  updateSuggestions(query);
  updateNamePreview(query);

  clearTimeout(debounceTimer);
  if(!query){
    setStatus('Select or enter a carpark number to see its availability.');
    boardEl.classList.remove('open');
    lastLookedUp = '';
    return;
  }
  // Auto-run once the typed value exactly matches a known carpark number,
  // or after a short pause so partial/unknown entries still get checked.
  if(allCarparkNumbers.includes(query)){
    debounceTimer = setTimeout(() => lookup(query), 150);
  } else {
    debounceTimer = setTimeout(() => lookup(query), 700);
  }
}

input.addEventListener('input', handleInput);
input.addEventListener('keydown', e => { if(e.key === 'Enter'){ clearTimeout(debounceTimer); lookup(input.value); suggestionsEl.classList.remove('open'); } });
document.addEventListener('click', e => {
  if(!e.target.closest('.search-wrap')) suggestionsEl.classList.remove('open');
});

setStatus('Select or enter a carpark number to see its availability.');

async function preloadCarparkList(){
  try{
    const res = await fetch(API_URL);
    const data = await res.json();
    const carparkData = (data.items && data.items[0] && data.items[0].carpark_data) || [];
    allCarparkNumbers = carparkData.map(c => c.carpark_number).sort();
    hintEl.innerHTML = `<b>${allCarparkNumbers.length.toLocaleString()}</b> carparks live right now. Start typing to see results.`;
  } catch(err){
    hintEl.textContent = 'Carpark suggestions unavailable — you can still search by exact carpark number.';
  }
}
async function preloadCarparkNames(){
  try{
    // Step 1: ask data.gov.sg for a signed download URL for the dataset.
    const pollRes = await fetch(`https://api-open.data.gov.sg/v1/public/api/datasets/${INFO_DATASET_ID}/poll-download`);
    const pollData = await pollRes.json();
    if(pollData.code !== 0 || !pollData.data || !pollData.data.url){
      throw new Error(pollData.errMsg || 'No download URL returned');
    }
    // Step 2: fetch the actual CSV from the signed URL.
    const csvRes = await fetch(pollData.data.url);
    const csvText = await csvRes.text();
    const rows = parseCSV(csvText);
    if(!rows.length) throw new Error('Empty dataset');

    const header = rows[0].map(h => h.trim().toLowerCase());
    const noIdx = header.indexOf('car_park_no');
    const addrIdx = header.indexOf('address');
    if(noIdx === -1 || addrIdx === -1) throw new Error('Unexpected column layout');

    const names = {};
    for(let i = 1; i < rows.length; i++){
      const r = rows[i];
      if(!r || !r[noIdx]) continue;
      names[r[noIdx].trim().toUpperCase()] = titleCase(r[addrIdx].trim());
    }
    carparkNames = names;

    // Refresh anything already on screen now that names are available.
    updateNamePreview(input.value.trim().toUpperCase());
    if(boardEl.classList.contains('open') && lastLookedUp){
      cpNameEl.textContent = carparkNames[lastLookedUp] || '';
    }
  } catch(err){
    console.error('Carpark name lookup unavailable:', err);
  }
}

preloadCarparkList();
preloadCarparkNames();
</script>
</body>
</html>
